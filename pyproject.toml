[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense"
dynamic = ["version"]
description = "Pothole detection from dashcam video and route recommendation by pothole risk."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pydantic>=2",
    "pillow",
    "numpy",
    "opencv-python",
]

[project.optional-dependencies]
# Ultralytics is pinned: its automatic optimiser choice and weight-decay scaling
# depend on the version, and were checked for 8.4.210 (see docs/decisions.md).
ml = ["torch", "torchvision", "ultralytics==8.4.210"]
geo = ["shapely", "pyproj", "osmnx", "networkx"]
api = ["fastapi", "uvicorn", "python-multipart"]
# pytest 9.2.0 fails at startup on Python 3.10 (NodeId slots dataclass bug).
# httpx is needed by FastAPI's TestClient.
dev = ["pytest<9.2", "httpx"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "roadsense.__version__"}

[tool.setuptools.package-data]
roadsense = ["storage/schema.sql", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
